<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Tide — Open-World Crime Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1020; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #16213a; display: block; box-shadow: 0 0 60px rgba(0,0,0,.6); }
  #fallback { color: #cfe3ff; font: 14px/1.5 system-ui, sans-serif; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="fallback" hidden>Neon Tide needs JavaScript and a canvas-capable browser.</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
